# Cloud Build config for MedVault backend.
# Builds the Docker image, pushes it to Artifact Registry, and deploys to Cloud Run.
#
# Prerequisites (run once):
#   gcloud auth login
#   gcloud config set project medvault-11c68
#   gcloud auth configure-docker asia-south1-docker.pkg.dev
#   gcloud artifacts repositories create medvault-backend \
#     --repository-format=docker --location=asia-south1
#   gcloud run deploy medvault-backend --region=asia-south1 --no-traffic  # first-time skeleton
#
# Trigger a build+deploy:
#   gcloud builds submit --config cloudbuild.yaml backend/

substitutions:
  _REGION: asia-south1
  _REPO: medvault-backend
  _SERVICE: medvault-backend
  _PROJECT_ID: medvault-11c68

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}
      - --set-secrets=OPENAI_API_KEY=medvault-openai-key:latest,CRON_SECRET=medvault-cron-secret:latest
      - --service-account=medvault-backend@${_PROJECT_ID}.iam.gserviceaccount.com
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=300

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:latest
