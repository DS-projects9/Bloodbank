name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [functions, app]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Build (functions)
        if: matrix.package == 'functions'
        working-directory: functions
        run: npm run build

      - name: Lint + typecheck (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: npm run lint

  rules-dry-run:
    name: firestore + storage rules compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Compile rules via Firestore emulator
        run: |
          timeout 120s firebase emulators:exec --only firestore "true" 2>&1 | tail -20